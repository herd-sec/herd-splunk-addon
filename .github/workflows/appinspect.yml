name: AppInspect

on:
  pull_request:
  push:
    branches: [main]

jobs:
  appinspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AppInspect
        run: |
          sudo apt-get update && sudo apt-get install -y libmagic1
          python -m pip install splunk-appinspect
      - name: Extraction tests
        run: python tests/test_extractions.py
      - name: AppInspect (precert, cloud)
        run: scripts/appinspect.sh
