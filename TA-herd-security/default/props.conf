#
# Sourcetypes for the events Herd Security posts to a Splunk HTTP Event
# Collector. Herd sets `time`, `host`, `source`, `sourcetype` and, if you named
# one, `index` itself; the event body is one JSON object.
#
# The HEC event endpoint does not line-break or look for a timestamp, so the
# settings below matter only when the same JSON reaches Splunk another way
# (a file or a forwarder).
#

# ---------------------------------------------------------------------------
# Security and risk events (phishing, training, identity posture, SIEM alerts,
# AI findings, ...). CIM: Alerts.
#
# The body has a key called "source". A search-time JSON extraction (KV_MODE =
# json) would write it into Splunk's own `source` field, so the fields are
# extracted by the REPORT transforms instead and the key becomes `herd_source`.
# ---------------------------------------------------------------------------
[herd:security:event]
DESCRIPTION = Security and risk events from Herd Security
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "occurredAt":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30
KV_MODE = none
REPORT-herd_security_fields = herd_security_string_fields, herd_security_type_field, herd_security_source_field

# CIM Alerts
EVAL-app = "herd"
EVAL-vendor_product = "Herd Security"
EVAL-type = "alert"
EVAL-severity = lower(severity)
EVAL-severity_id = case(upper(severity)=="CRITICAL", 4, upper(severity)=="HIGH", 3, upper(severity)=="MEDIUM", 2, upper(severity)=="LOW", 1, true(), null())
EVAL-signature_id = herd_source . ":" . eventType
FIELDALIAS-herd_alert_id = eventId AS id
FIELDALIAS-herd_alert_signature = eventType AS signature
FIELDALIAS-herd_alert_user = actorEmail AS user
FIELDALIAS-herd_alert_user_id = actorUserId AS user_id

# ---------------------------------------------------------------------------
# Points earned (opt-in event type). One event per points ledger entry.
# ---------------------------------------------------------------------------
[herd:points:earned]
DESCRIPTION = Points earned events from Herd Security
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "occurredAt":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30
KV_MODE = json
EVAL-app = "herd"
EVAL-vendor_product = "Herd Security"
EVAL-user = 'user.email'
EVAL-user_id = 'user.id'

# ---------------------------------------------------------------------------
# AI corrections (opt-in event type). One event per rule decision on an AI
# tool or agent's tool call. Never carries prompt text.
# ---------------------------------------------------------------------------
[herd:ai:correction]
DESCRIPTION = AI correction events from Herd Security
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "occurredAt":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30
KV_MODE = json
EVAL-app = "herd"
EVAL-vendor_product = "Herd Security"
EVAL-user = 'user.email'
EVAL-user_id = 'user.id'
EVAL-signature = 'policy.name'

# ---------------------------------------------------------------------------
# The test event Herd sends from "Send test event".
# ---------------------------------------------------------------------------
[herd:test]
DESCRIPTION = Test events from Herd Security
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
