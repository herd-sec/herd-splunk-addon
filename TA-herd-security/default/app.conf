#
# Herd Security Add-on for Splunk
#

[install]
state = enabled
build = 1

[id]
name = TA-herd-security
version = 1.0.0

[package]
id = TA-herd-security
check_for_updates = true

[launcher]
author = Herd Security
version = 1.0.0
description = Parses and normalises the security and risk events Herd Security sends to a Splunk HTTP Event Collector, and maps them to the Common Information Model (Alerts).

[ui]
is_visible = false
label = Herd Security Add-on for Splunk
