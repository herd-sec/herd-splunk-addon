#
# Search-time field extractions for [herd:security:event].
#
# The body is a flat JSON object, so each field is a quoted key and a quoted
# string value. A null value (an event with no actor) has no quotes and so
# yields no field. The value pattern allows escaped quotes inside the string.
#

# eventId, eventType, severity, outcome, occurredAt, actorUserId, actorEmail
[herd_security_string_fields]
REGEX = "(eventId|eventType|severity|outcome|occurredAt|actorUserId|actorEmail)":"((?:[^"\\]|\\.)*)"
FORMAT = $1::$2

# The body's "type" is always "security_event". Kept as herd_type so it does not
# collide with the CIM `type` field.
[herd_security_type_field]
REGEX = "type":"((?:[^"\\]|\\.)*)"
FORMAT = herd_type::$1

# The body's "source" is the Herd event source (phishing, okta, training, ...).
# Kept as herd_source so it does not overwrite Splunk's own `source`.
[herd_security_source_field]
REGEX = "source":"((?:[^"\\]|\\.)*)"
FORMAT = herd_source::$1
