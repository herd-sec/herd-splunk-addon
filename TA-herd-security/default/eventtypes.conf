# Every security and risk event Herd sends.
[herd_security_event]
search = sourcetype="herd:security:event"

# The events that say a person did something risky (outcome=negative). A
# positive outcome (a phish reported, a training completed) is not an alert.
[herd_security_alert]
search = sourcetype="herd:security:event" outcome=negative

[herd_points_earned]
search = sourcetype="herd:points:earned"

[herd_ai_correction]
search = sourcetype="herd:ai:correction"
